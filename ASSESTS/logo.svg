<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#7000ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Hexagon / Diamond Outline -->
  <polygon points="50,8 90,29 90,71 50,92 10,71 10,29" 
           fill="none" 
           stroke="url(#logoGrad)" 
           stroke-width="2.5" 
           stroke-opacity="0.4" />

  <!-- Minimalist Geometric Letter 'A' -->
  <g filter="url(#glow)">
    <path d="M 50 20 L 75 78 L 62 78 L 56 64 L 44 64 L 38 78 L 25 78 Z M 50 38 L 45 52 L 55 52 Z" 
          fill="url(#logoGrad)" />
    <!-- Modern tech accent dot -->
    <circle cx="50" cy="22" r="3" fill="#00f2fe" />
  </g>
</svg>
